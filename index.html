<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Player web para painéis Xtream Codes — Ao vivo, Filmes e Séries">
  <title>XStream Web</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="login-screen" class="screen">
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo">▶</div>
        <h1>XStream Web</h1>
        <p class="muted">Entre com os dados do seu painel Xtream Codes</p>
      </div>

      <form id="login-form" autocomplete="on">
        <label>
          Endereço do servidor
          <input type="text" id="inp-server" name="server" placeholder="http://exemplo.com:8080" required autocomplete="url">
        </label>
        <label>
          Usuário
          <input type="text" id="inp-user" name="username" placeholder="seu_usuario" required autocomplete="username">
        </label>
        <label>
          Senha
          <input type="password" id="inp-pass" name="password" placeholder="••••••••" required autocomplete="current-password">
        </label>

        <div class="row-between">
          <label class="check">
            <input type="checkbox" id="inp-remember" checked>
            Lembrar dados
          </label>
          <button type="button" id="btn-adv" class="link-btn">Opções avançadas</button>
        </div>

        <div id="adv-box" class="adv-box hidden">
          <label>
            Modo de conexão
            <select id="inp-mode">
              <option value="auto">Automático (recomendado)</option>
              <option value="direct">Direto (sem proxy)</option>
              <option value="proxy">Proxy embutido (/api/proxy)</option>
              <option value="custom">Proxy personalizado</option>
            </select>
          </label>
          <label id="custom-proxy-label" class="hidden">
            URL do proxy (prefixo)
            <input type="text" id="inp-proxy" placeholder="https://seu-proxy.com/?url=">
          </label>
          <p class="hint">No GitHub Pages (sem backend), se der erro de CORS use um proxy personalizado ou publique no Vercel.</p>
        </div>

        <p id="login-error" class="error hidden"></p>

        <button type="submit" id="btn-login" class="btn-primary">Entrar</button>
      </form>

      <p class="muted footer-note">Funciona local, no GitHub Pages e no Vercel.</p>
    </div>
  </section>

  <section id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mini">▶ XStream</span>
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="live">Ao Vivo</button>
          <button class="tab" data-tab="vod">Filmes</button>
          <button class="tab" data-tab="series">Séries</button>
          <button class="tab" data-tab="account">Conta</button>
        </nav>
      </div>
      <div class="topbar-right">
        <button id="btn-logout" class="btn-ghost" title="Sair">Sair</button>
      </div>
    </header>

    <div id="toolbar" class="toolbar">
      <input type="search" id="inp-search" placeholder="Buscar...">
      <select id="inp-category">
        <option value="">Carregando categorias...</option>
      </select>
      <button id="btn-refresh" class="btn-ghost" title="Atualizar">↻</button>
    </div>

    <main id="content" class="content">
      <div id="grid" class="grid"></div>
      <div class="load-more-wrap">
        <button id="btn-more" class="btn-ghost hidden">Carregar mais</button>
      </div>
      <div id="empty-state" class="empty hidden">
        <p>Nenhum resultado encontrado.</p>
      </div>
      <div id="loading" class="loading hidden"><div class="spinner"></div><p>Carregando...</p></div>

      <div id="account-panel" class="account-panel hidden"></div>
    </main>
  </section>

  <div id="player-modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="player-title">—</h2>
        <button class="btn-ghost" data-close>✕</button>
      </div>
      <div class="player-wrap">
        <video id="video" controls autoplay playsinline></video>
        <div id="player-msg" class="player-msg hidden"></div>
      </div>
      <div id="epg-box" class="epg-box hidden"></div>
      <div id="series-box" class="series-box hidden">
        <div class="series-controls">
          <select id="inp-season"></select>
          <select id="inp-episode"></select>
        </div>
      </div>
      <div id="plot-box" class="plot-box hidden"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
